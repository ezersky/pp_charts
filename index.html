<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuickChart UI</title>
  <style>
    body { 
      padding: 16px; 
      margin: 0; 
      box-sizing: border-box; 
      font-family: sans-serif; 
      background-color: #1e1e1e; 
      color: #ffffff; 
    }
    .form-group { margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    
    .pp-label { color: #b3b3b3; margin-bottom: 4px; display: block; font-size: 12px; font-weight: 500; }
    
    .pp-input, .pp-select { 
      background-color: #2d2d2d; 
      color: #ffffff; 
      border: 1px solid #444444; 
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .pp-select { width: 100%; height: 32px; }
    .pp-input { width: 100%; height: 32px; }
    
    .btn-group { display: flex; gap: 8px; margin-top: 14px; }
    .pp-btn { cursor: pointer; font-weight: 500; border: none; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
    .pp-btn-primary { background-color: #2f80ed; color: white; }
    .pp-btn-primary:hover { background-color: #1b6fd1; }
    .pp-btn-secondary { background-color: #333333; color: #e0e0e0; border: 1px solid #444444; }
    .pp-btn-secondary:hover { background-color: #444444; }
  </style>
</head>
<body class="pp-theme-dark">
  <div class="form-group">
    <label class="pp-label">Тип чарта</label>
    <select id="chartType" class="pp-select">
      <option value="line">Line (Линейный)</option>
      <option value="bar">Bar (Столбчатый)</option>
      <option value="doughnut" selected>Doughnut (Пончик)</option>
      <option value="pie">Pie (Круговой)</option>
      <option value="radar">Radar (Радарная)</option>
    </select>
  </div>
  
  <div class="form-group row">
    <div>
      <label class="pp-label">Ширина (px)</label>
      <input type="number" id="width" class="pp-input" value="500">
    </div>
    <div>
      <label class="pp-label">Высота (px)</label>
      <input type="number" id="height" class="pp-input" value="350">
    </div>
  </div>

  <div class="form-group row">
    <div>
      <label class="pp-label">Набор токенов</label>
      <select id="tokenGroup" class="pp-select">
        <option value="">Загрузка палитр...</option>
      </select>
    </div>
    <div>
      <label class="pp-label">Основной цвет токена</label>
      <select id="tokenColor" class="pp-select">
        <option value="">Выберите набор...</option>
      </select>
    </div>
  </div>
  
  <div class="form-group">
    <label class="pp-label">Данные графика (через запятую)</label>
    <input type="text" id="chartDataValues" class="pp-input" value="45, 65, 30">
  </div>

  <div class="form-group">
    <label class="pp-label">Подписи осей (через запятую)</label>
    <input type="text" id="chartLabels" class="pp-input" value="Янв, Фев, Мар">
  </div>

  <div class="form-group">
    <label class="pp-label">Доп. цвета чарта (HEX через запятую)</label>
    <input type="text" id="chartColors" class="pp-input" value="#10B981, #F59E0B, #EF4444, #8B5CF6">
  </div>
  
  <button id="insertBtn" class="pp-btn pp-btn-primary" style="width: 100%; height: 36px; border-radius: 4px;">Вставить в макет</button>
  
  <div class="btn-group">
    <button id="saveSvgBtn" class="pp-btn pp-btn-secondary" style="flex: 1; height: 32px; border-radius: 4px;">Скачать SVG</button>
    <button id="savePngBtn" class="pp-btn pp-btn-secondary" style="flex: 1; height: 32px; border-radius: 4px;">Скачать PNG</button>
  </div>

  <script>
    let penpotColorTokens = {};

    window.addEventListener('DOMContentLoaded', () => {
      parent.postMessage({ type: 'get-color-tokens' }, '*');
    });

    window.addEventListener('message', (event) => {
      const message = event.data;
      if (message && message.type === 'response-color-tokens' && message.tokens) {
        parseTokens(message.tokens);
      }
    });

    function parseTokens(tokens) {
      penpotColorTokens = {};
      
      if (!tokens || tokens.length === 0) {
        const groupSelect = document.getElementById('tokenGroup');
        groupSelect.innerHTML = '<option value="">В файле нет токенов цвета</option>';
        return;
      }

      tokens.forEach(token => {
        const parts = token.name.split('/');
        const groupName = parts.length > 1 ? parts[0].trim() : 'Общие палитры';
        const colorName = parts.length > 1 ? parts.slice(1).join('/') : token.name;

        if (!penpotColorTokens[groupName]) {
          penpotColorTokens[groupName] = [];
        }
        penpotColorTokens[groupName].push({ name: colorName, value: token.value });
      });

      updateGroupSelect();
    }

    function updateGroupSelect() {
      const groupSelect = document.getElementById('tokenGroup');
      groupSelect.innerHTML = '<option value="">-- Не выбрано (Дефолт) --</option>';

      Object.keys(penpotColorTokens).forEach(group => {
        const option = document.createElement('option');
        option.value = group;
        option.textContent = group;
        groupSelect.appendChild(option);
      });

      updateColorSelect();
    }

    document.getElementById('tokenGroup').onchange = updateColorSelect;

    function updateColorSelect() {
      const groupSelect = document.getElementById('tokenGroup');
      const colorSelect = document.getElementById('tokenColor');
      const selectedGroup = groupSelect.value;

      colorSelect.innerHTML = '';

      if (!selectedGroup || !penpotColorTokens[selectedGroup]) {
        colorSelect.innerHTML = '<option value="">Выберите набор...</option>';
        return;
      }

      penpotColorTokens[selectedGroup].forEach(token => {
        const option = document.createElement('option');
        option.value = token.value;
        option.textContent = token.name + " (" + token.value + ")";
        colorSelect.appendChild(option);
      });
    }

    function buildConfig(fmt = 'svg') {
      const rawValues = document.getElementById('chartDataValues').value;
      const dataArray = rawValues.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
      
      const rawLabels = document.getElementById('chartLabels').value;
      const labelsArray = rawLabels.split(',').map(l => l.trim()).filter(l => l.length > 0);

      const type = document.getElementById('chartType').value;
      const selectedTokenColor = document.getElementById('tokenColor').value;

      const rawColors = document.getElementById('chartColors').value;
      let additionalColors = rawColors.split(',').map(c => c.trim()).filter(c => c.length > 0);
      
      let finalPalette = [];
      if (selectedTokenColor) {
        finalPalette.push(selectedTokenColor);
      }
      finalPalette = finalPalette.concat(additionalColors);

      if (finalPalette.length === 0) {
        finalPalette = ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6", "#6B7280"];
      }

      const dataset = {
        label: "Показатели",
        data: dataArray
      };

      if (type === 'pie' || type === 'doughnut') {
        dataset.backgroundColor = finalPalette.slice(0, dataArray.length);
      } else if (type === 'line') {
        const primaryColor = finalPalette[0];
        dataset.borderColor = primaryColor;
        dataset.backgroundColor = primaryColor + "1A"; 
        dataset.fill = false;
      } else if (type === 'radar') {
        const primaryColor = finalPalette[0];
        dataset.borderColor = primaryColor;
        dataset.backgroundColor = primaryColor + "33"; 
        dataset.fill = true;
      } else {
        if (finalPalette.length >= dataArray.length && selectedTokenColor === "") {
          dataset.backgroundColor = finalPalette.slice(0, dataArray.length);
        } else {
          dataset.backgroundColor = finalPalette[0];
        }
        dataset.fill = true;
      }

      const scalesConfig = (type === 'pie' || type === 'doughnut' || type === 'radar') ? {} : {
        yAxes: [{ gridLines: { color: 'rgba(255,255,255,0.1)' }, ticks: { fontColor: '#ffffff' } }],
        xAxes: [{ gridLines: { color: 'rgba(255,255,255,0.1)' }, ticks: { fontColor: '#ffffff' } }]
      };

      return { 
        format: fmt, 
        width: parseInt(document.getElementById('width').value) || 500, 
        height: parseInt(document.getElementById('height').value) || 350,
        chart: { 
          type: type, 
          data: {
            labels: labelsArray,
            datasets: [dataset]
          },
          options: { 
            responsive: true,
            legend: {
              labels: { fontColor: '#ffffff' }
            },
            scales: scalesConfig
          } 
        } 
      };
    }
    
    document.getElementById('insertBtn').onclick = async () => {
      const cfg = buildConfig('svg'); 
      try {
        const res = await fetch('https://qc.ezersky.ru/chart', { 
          method: 'POST', 
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'image/svg+xml, text/plain, */*'
          }, 
          body: JSON.stringify(cfg) 
        });
        if (!res.ok) throw new Error();
        const svgCode = await res.text();
        parent.postMessage({ type: 'insert-chart', svgCode: svgCode }, '*');
      } catch(e) {
        alert('Сервер qc.ezersky.ru не вернул данные. Убедитесь, что Docker запущен.');
      }
    };
    
    document.getElementById('saveSvgBtn').onclick = async () => {
      const cfg = buildConfig('svg');
      try {
        const res = await fetch('https://qc.ezersky.ru/chart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
        download(await res.text(), 'chart.svg', 'image/svg+xml');
      } catch(e) { alert('Ошибка скачивания SVG'); }
    };
    
    document.getElementById('savePngBtn').onclick = async () => {
      const cfg = buildConfig('png');
      try {
        const res = await fetch('ezersky.ru', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
        const blob = await res.blob();
        const u = window.URL.createObjectURL(blob);
        const a = document.createElement('a'); 
        a.href = u; a.download = 'chart.png'; a.click();} catch(e) { 
          alert('Ошибка скачивания PNG'); 
        }
    };
    function download(c, f, m) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([c], {type: m}));
      a.download = f;a.click();
   }
