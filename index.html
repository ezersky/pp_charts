<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/@penpot/plugin-styles/styles.css">
  <style>
    body { padding: 12px; margin: 0; box-sizing: border-box; }
    .form-group { margin-bottom: 12px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    textarea { font-family: monospace; min-height: 100px; resize: vertical; }
    .btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .token-badge { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 4px; background: var(--pp-bg-secondary); margin: 2px; cursor: pointer; }
  </style>
</head>
<body class="pp-theme-dark">

  <div class="form-group">
    <label class="pp-label">Тип чарта</label>
    <select id="chartType" class="pp-select">
      <option value="line">Line (Линейный)</option>
      <option value="bar">Bar (Столбчатый)</option>
      <option value="doughnut">Doughnut (Пончик)</option>
      <option value="pie">Pie (Круговой)</option>
      <option value="radar">Radar (Радарный)</option>
    </select>
  </div>

  <div class="row form-group">
    <div>
      <label class="pp-label">Ширина (px)</label>
      <input type="number" id="width" class="pp-input" value="600">
    </div>
    <div>
      <label class="pp-label">Высота (px)</label>
      <input type="number" id="height" class="pp-input" value="400">
    </div>
  </div>

  <div class="form-group">
    <label class="pp-label">Данные (Datasets JSON)</label>
    <textarea id="chartData" class="pp-input">[
  {
    "label": "Продажи",
    "data": [12, 19, 3, 5, 2, 3],
    "borderColor": "#3B82F6",
    "backgroundColor": "rgba(59, 130, 246, 0.2)"
  }
]</textarea>
  </div>

  <div class="form-group">
    <label class="pp-label">Доступные токены цвета (клик для копирования HEX):</label>
    <div id="tokensList">Загрузка токенов макета...</div>
  </div>

  <button id="insertBtn" class="pp-btn pp-btn-primary" style="width: 100%;">Вставить в макет</button>
  
  <div class="btn-group">
    <button id="saveSvgBtn" class="pp-btn pp-btn-secondary" style="flex: 1;">Скачать SVG</button>
    <button id="savePngBtn" class="pp-btn pp-btn-secondary" style="flex: 1;">Скачать PNG</button>
  </div>

  <script>
    let currentSvgCode = '';
    const API_URL = 'https://qc.ezersky.ru/chart';

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg.type === 'init-tokens') {
        const list = document.getElementById('tokensList');
        list.innerHTML = '';
        if(!msg.tokens || msg.tokens.length === 0) {
          list.innerText = 'Токены цвета не найдены в файле';
          return;
        }
        msg.tokens.forEach(t => {
          const badge = document.createElement('span');
          badge.className = 'token-badge';
          badge.innerText = `${t.name}: ${t.color}`;
          badge.onclick = () => {
            navigator.clipboard.writeText(t.color);
          };
          list.appendChild(badge);
        });
      }
    });

    function buildConfig(formatType = 'svg') {
      const type = document.getElementById('chartType').value;
      const width = parseInt(document.getElementById('width').value);
      const height = parseInt(document.getElementById('height').value);
      let datasets = [];
      
      try {
        datasets = JSON.parse(document.getElementById('chartData').value);
      } catch(e) {
        alert('Ошибка в формате JSON датасетов!');
        return null;
      }

      const labels = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл"].slice(0, datasets[0].data.length);

      return {
        format: formatType,
        width: width,
        height: height,
        chart: {
          type: type,
          data: {
            labels: labels,
            datasets: datasets
          },
          options: {
            responsive: true
          }
        }
      };
    }

    document.getElementById('insertBtn').onclick = async () => {
      const config = buildConfig('svg');
      if (!config) return;

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config)
      });
      
      currentSvgCode = await response.text();
      parent.postMessage({ type: 'insert-chart', svgCode: currentSvgCode }, '*');
    };

    document.getElementById('saveSvgBtn').onclick = async () => {
      const config = buildConfig('svg');
      if (!config) return;
      
      const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
      const text = await response.text();
      
      downloadFile(text, 'chart.svg', 'image/svg+xml');
    };

    document.getElementById('savePngBtn').onclick = async () => {
      const config = buildConfig('png');
      if (!config) return;
      
      const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
      const blob = await response.blob();
      
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'chart.png';
      a.click();
    };

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement("a");
      const file = new Blob([content], {type: contentType});
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
    }
  </script>
</body>
</html>
