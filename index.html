<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuickChart UI</title>
  <style>
    body { 
      padding: 16px; 
      margin: 0; 
      box-sizing: border-box; 
      font-family: sans-serif; 
      background-color: #1e1e1e; 
      color: #ffffff; 
    }
    .form-group { margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    
    .pp-label { color: #b3b3b3; margin-bottom: 4px; display: block; font-size: 12px; font-weight: 500; }
    
    .pp-input, .pp-select { 
      background-color: #2d2d2d; 
      color: #ffffff; 
      border: 1px solid #444444; 
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .pp-select { width: 100%; height: 32px; }
    .pp-input { width: 100%; height: 32px; }
    
    .btn-group { display: flex; gap: 8px; margin-top: 14px; }
    .pp-btn { cursor: pointer; font-weight: 500; border: none; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
    .pp-btn-primary { background-color: #2f80ed; color: white; }
    .pp-btn-primary:hover { background-color: #1b6fd1; }
    .pp-btn-secondary { background-color: #333333; color: #e0e0e0; border: 1px solid #444444; }
    .pp-btn-secondary:hover { background-color: #444444; }
  </style>
</head>
<body class="pp-theme-dark">
 <div class="form-group">
    <label class="pp-label">Тип чарта</label>
    <select id="chartType" class="pp-select">
      <option value="line">Line (Линейный)</option>
      <option value="bar">Bar (Столбчатый)</option>
      <option value="doughnut" selected>Doughnut (Пончик)</option>
      <option value="pie">Pie (Круговой)</option>
      <option value="radar">Radar (Радарная)</option>
    </select>
  </div>
  
  <div class="form-group row">
    <div>
      <label class="pp-label">Ширина (px)</label>
      <input type="number" id="width" class="pp-input" value="500">
    </div>
    <div>
      <label class="pp-label">Высота (px)</label>
      <input type="number" id="height" class="pp-input" value="350">
    </div>
  </div>

  <div class="form-group">
    <label class="pp-label">Название 1-го датасета (Основной)</label>
    <input type="text" id="datasetLabel1" class="pp-input" value="Dataset 1">
  </div>
  
  <div class="form-group">
    <label class="pp-label">Данные графика 1-й оси (через запятую)</label>
    <input type="text" id="chartDataValues" class="pp-input" value="45, 65, 30">
  </div>

  <!-- БЛОК ДЛЯ ВТОРОЙ ОСИ: Показывается только если выбран Bar -->
  <div id="secondAxisBlock" style="display: none; border-left: 2px solid #3B82F6; padding-left: 10px; margin: 15px 0;">
    <div class="form-group">
      <label class="pp-label" style="color: #3B82F6;">Название 2-го датасета (Вторая ось)</label>
      <input type="text" id="datasetLabel2" class="pp-input" value="Dataset 2">
    </div>
    
    <div class="form-group">
      <label class="pp-label" style="color: #3B82F6;">Данные графика 2-й оси (через запятую)</label>
      <input type="text" id="chartDataValues2" class="pp-input" value="100, 200, 300">
    </div>
  </div>

  <div class="form-group">
    <label class="pp-label">Подписи осей (X-axis labels, через запятую)</label>
    <input type="text" id="chartLabels" class="pp-input" value="Янв, Фев, Мар">
  </div>

  <!-- НОВОЕ ПОЛЕ: Настройки цветов чарта -->
  <div class="form-group">
    <label class="pp-label">Цвета чарта (HEX через запятую)</label>
    <input type="text" id="chartColors" class="pp-input" value="#3B82F6, #10B981, #F59E0B">
  </div>
  
  <button id="insertBtn" class="pp-btn pp-btn-primary" style="width: 100%; height: 36px; border-radius: 4px;">Вставить в макет</button>
  
  <div class="btn-group">
    <button id="saveSvgBtn" class="pp-btn pp-btn-secondary" style="flex: 1; height: 32px; border-radius: 4px;">Скачать SVG</button>
    <button id="savePngBtn" class="pp-btn pp-btn-secondary" style="flex: 1; height: 32px; border-radius: 4px;">Скачать PNG</button>
  </div>

  <script>
    document.getElementById('chartType').addEventListener('change', function(e) {
      const secondAxisBlock = document.getElementById('secondAxisBlock');
      if (e.target.value === 'bar') {
        secondAxisBlock.style.display = 'block';
      } else {
        secondAxisBlock.style.display = 'none';
      }
    });

    // Функция для безопасного добавления прозрачности к HEX-цветам
    function getAlphaColor(hex, opacity) {
      if (!hex || !hex.startsWith('#')) return hex || "#3B82F6";
      let clean = hex.replace('#', '');
      if (clean.length === 3) clean = clean.split('').map(s => s + s).join('');
      const alpha = Math.round(opacity * 255).toString(16).padStart(2, '0');
      return '#' + clean + alpha;
    }

    function buildConfig(fmt = 'svg') {
      const type = document.getElementById('chartType').value;
      const rawColors = document.getElementById('chartColors').value;
      
      // Палитра цветов по умолчанию
      let palette = rawColors.split(',').map(c => c.trim()).filter(c => c.length > 0);
      if (palette.length === 0) palette = ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6", "#6B7280"];

      // 1. Получение и обработка данных 1-го датасета
      const dataArray1 = document.getElementById('chartDataValues').value.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
      const label1 = document.getElementById('datasetLabel1').value || "Показатели 1";
      
      const dataset1 = { 
        label: label1, 
        data: dataArray1,
        yAxisID: type === 'bar' ? 'y-axis-1' : undefined 
      };

      // Логика цветов для 1-го датасета
      if (['pie', 'doughnut', 'bar'].includes(type)) {
        dataset1.backgroundColor = type === 'bar' ? palette[0] : palette.slice(0, dataArray1.length);
      } else {
        dataset1.borderColor = palette[0];
        dataset1.backgroundColor = 'rgba(59, 130, 246, 0.1)';
      }

      const datasets = [dataset1];
      let scalesConfig = {};
      let maxDataLength = dataArray1.length;

      // 2. Если выбран тип BAR, добавляем второй датасет и настраиваем оси
      if (type === 'bar') {
        const dataArray2 = document.getElementById('chartDataValues2').value.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
        const label2 = document.getElementById('datasetLabel2').value || "Показатели 2";
        
        const dataset2 = {
          label: label2,
          data: dataArray2,
          backgroundColor: palette[1] || '#F59E0B',
          yAxisID: 'y-axis-2'
        };
        
        datasets.push(dataset2);
        
        // Считаем максимальную длину среди двух массивов, чтобы подписи осей не резались
        maxDataLength = Math.max(dataArray1.length, dataArray2.length);

        // Двойная ось Y для столбчатого чарта
        scalesConfig = {
          yAxes: [
            { id: 'y-axis-1', type: 'linear', position: 'left' },
            { id: 'y-axis-2', type: 'linear', position: 'right', gridLines: { drawOnChartArea: false } }
          ]
        };
      }

      // 3. Обработка подписей (X-axis labels) без ограничения в 8 элементов
      let labelsArray = document.getElementById('chartLabels').value.split(',').map(l => l.trim()).filter(l => l.length > 0);
      
      // Автозаполнение подписей, если пользователь ввел данных больше, чем подписей
      while (labelsArray.length < maxDataLength) {
        labelsArray.push(`${labelsArray.length + 1}`);
      }
      // Обрезаем массив подписей ровно под максимальное количество элементов данных
      labelsArray = labelsArray.slice(0, maxDataLength);

      // 4. Итоговая конфигурация QuickChart
      return { 
        format: fmt, 
        chart: { 
          type: type, 
          data: { labels: labelsArray, datasets: datasets },
          options: { 
            scales: scalesConfig
          } 
        } 
      };
    }
    
    // Вставка чарта на холст Penpot
    document.getElementById('insertBtn').onclick = async () => {
      const cfg = buildConfig('svg'); 
      try {
        const res = await fetch('https://qc.ezersky.ru/chart', { 
          method: 'POST', 
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'image/svg+xml, text/plain, */*'
          }, 
          body: JSON.stringify(cfg) 
        });
        if (!res.ok) throw new Error();
        const svgCode = await res.text();
        parent.postMessage({ type: 'insert-chart', svgCode: svgCode }, '*');
      } catch(e) {
        alert('Сервер qc.ezersky.ru не вернул данные. Убедитесь, что Docker запущен.');
      }
    };
    
    // Скачивание SVG файла
    document.getElementById('saveSvgBtn').onclick = async () => {
      const cfg = buildConfig('svg');
      try {
        const res = await fetch('https://qc.ezersky.ru/chart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
        download(await res.text(), 'chart.svg', 'image/svg+xml');
      } catch(e) { alert('Ошибка скачивания SVG'); }
    };
    
    // Скачивание PNG файла
    document.getElementById('savePngBtn').onclick = async () => {
      const cfg = buildConfig('png');
      try {
        const res = await fetch('https://qc.ezersky.ru/chart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
        const blob = await res.blob();
        const u = window.URL.createObjectURL(blob);
        const a = document.createElement('a'); 
        a.href = u; 
        a.download = 'chart.png'; 
        a.click();
      } catch(e) { 
        alert('Ошибка скачивания PNG'); 
      }
    };

    function download(c, f, m) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([c], {type: m}));
      a.download = f;
      a.click();
    }
</script>

</body>
</html>
