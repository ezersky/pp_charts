<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuickChart UI</title>
  <link rel="stylesheet" href="https://unpkg.com">
  <style>
    body { padding: 16px; margin: 0; box-sizing: border-box; font-family: sans-serif; }
    .form-group { margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    textarea { font-family: monospace; min-height: 110px; resize: vertical; font-size: 11px; }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .tokens-container { max-height: 90px; overflow-y: auto; border: 1px solid var(--pp-border-primary, #444); padding: 6px; border-radius: 4px; background: var(--pp-bg-secondary, #222); }
    .token-badge { display: inline-block; padding: 3px 6px; font-size: 11px; border-radius: 4px; background: var(--pp-bg-primary, #333); margin: 3px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: #fff; }
    .token-badge:hover { opacity: 0.8; }
    .fallback-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body class="pp-theme-dark">
  <div class="form-group">
    <label class="pp-label">Тип чарта</label>
    <select id="chartType" class="pp-select">
      <option value="line">Line (Линейный)</option>
      <option value="bar">Bar (Столбчатый)</option>
      <option value="doughnut" selected>Doughnut (Пончик)</option>
      <option value="pie">Pie (Круговой)</option>
    </select>
  </div>
  <div class="form-group row">
    <div>
      <label class="pp-label">Ширина</label>
      <input type="number" id="width" class="pp-input" value="500">
    </div>
    <div>
      <label class="pp-label">Высота</label>
      <input type="number" id="height" class="pp-input" value="350">
    </div>
  </div>
  <div class="form-group">
    <label class="pp-label">Конфигурация (JSON)</label>
    <textarea id="chartData" class="pp-input">[{"label":"Данные","data":[30,50,20],"backgroundColor":["#3B82F6","#10B981","#F59E0B"]}]</textarea>
  </div>
  <div class="form-group">
    <label class="pp-label">Цвета (клик для копирования):</label>
    <div id="tokensList" class="tokens-container">Загрузка...</div>
  </div>
  <button id="insertBtn" class="pp-btn pp-btn-primary" style="width: 100%;">Вставить в макет</button>
  <div class="btn-group">
    <button id="saveSvgBtn" class="pp-btn pp-btn-secondary" style="flex: 1;">Скачать SVG</button>
    <button id="savePngBtn" class="pp-btn pp-btn-secondary" style="flex: 1;">Скачать PNG</button>
  </div>
  <script>
    const API_URL = 'https://ezersky.ru';
    const DEFAULT_PALETTE = [{name:"Синий",color:"#3B82F6"},{name:"Зеленый",color:"#10B981"},{name:"Оранжевый",color:"#F59E0B"},{name:"Красный",color:"#EF4444"}];
    window.onload = () => { parent.postMessage({ type: 'ui-ready' }, '*'); };
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'init-tokens') renderTokens(e.data.tokens); });
    function renderTokens(tokens) {
      const container = document.getElementById('tokensList'); container.innerHTML = '';
      if (!tokens || tokens.length === 0) {
        const t = document.createElement('div'); t.className = 'fallback-title'; t.innerText = 'Палитра (в ассетах пусто):'; container.appendChild(t);
        DEFAULT_PALETTE.forEach(createBadge);
      } else { tokens.forEach(createBadge); }
    }
    function createBadge(t) {
      const b = document.createElement('span'); b.className = 'token-badge'; b.style.borderLeft = `4px solid ${t.color}`; b.innerText = `${t.name} (${t.color})`;
      b.onclick = () => navigator.clipboard.writeText(t.color); document.getElementById('tokensList').appendChild(b);
    }
    function buildConfig(fmt = 'svg') {
      try {
        const ds = JSON.parse(document.getElementById('chartData').value);
        return { format: fmt, width: parseInt(document.getElementById('width').value), height: parseInt(document.getElementById('height').value),
          chart: { type: document.getElementById('chartType').value, data: { labels: ["А","Б","В","Г"].slice(0, ds[0].data.length), datasets: ds }, options: { responsive: true } }
        };
      } catch(e) { alert('Ошибка JSON'); return null; }
    }
    document.getElementById('insertBtn').onclick = async () => {
      const cfg = buildConfig('svg'); if (!cfg) return;
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
      parent.postMessage({ type: 'insert-chart', svgCode: await res.text() }, '*');
    };
    document.getElementById('saveSvgBtn').onclick = async () => {
      const cfg = buildConfig('svg'); if (!cfg) return;
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
      download(await res.text(), 'chart.svg', 'image/svg+xml');
    };
    document.getElementById('savePngBtn').onclick = async () => {
      const cfg = buildConfig('png'); if (!cfg) return;
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
      const u = window.URL.createObjectURL(await res.blob()); const a = document.createElement('a'); a.href = u; a.download = 'chart.png'; a.click();
    };
    function download(c, f, m) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([c], {type: m})); a.download = f; a.click(); }
  </script>
</body>
</html>
