<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuickChart UI</title>
  <link rel="stylesheet" href="https://unpkg.com">
  <style>
    body { padding: 16px; margin: 0; box-sizing: border-box; font-family: sans-serif; background-color: #1e1e1e; color: #ffffff; }
    .form-group { margin-bottom: 14px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .pp-label { color: #b3b3b3 !important; margin-bottom: 4px; display: block; font-size: 12px; }
    .pp-input, .pp-select, textarea { background-color: #2d2d2d !important; color: #ffffff !important; border: 1px solid #444444 !important; }
    textarea { font-family: monospace; min-height: 110px; resize: vertical; font-size: 11px; width: 100%; box-sizing: border-box; }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .tokens-container { max-height: 90px; overflow-y: auto; border: 1px solid #444; padding: 6px; border-radius: 4px; background: #121212; }
    .token-badge { display: inline-block; padding: 3px 6px; font-size: 11px; border-radius: 4px; background: #2a2a2a; margin: 3px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: #fff; }
    .token-badge:hover { background: #3a3a3a; }
    .fallback-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 4px; }
    .pp-btn { cursor: pointer; font-weight: 500; }
    .pp-btn-primary { background-color: #2f80ed !important; color: white !important; border: none; }
    .pp-btn-primary:hover { background-color: #1b6fd1 !important; }
    .pp-btn-secondary { background-color: #333333 !important; color: #e0e0e0 !important; border: 1px solid #444444 !important; }
    .pp-btn-secondary:hover { background-color: #444444 !important; }
  </style>
</head>
<body class="pp-theme-dark">
  <div class="form-group">
    <label class="pp-label">Тип чарта</label>
    <select id="chartType" class="pp-select">
      <option value="line" selected>Line (Линейный)</option>
      <option value="bar">Bar (Столбчатый)</option>
      <option value="doughnut">Doughnut (Пончик)</option>
      <option value="pie">Pie (Круговой)</option>
    </select>
  </div>
  
  <div class="form-group row">
    <div>
      <label class="pp-label">Ширина</label>
      <input type="number" id="width" class="pp-input" value="500">
    </div>
    <div>
      <label class="pp-label">Высота</label>
      <input type="number" id="height" class="pp-input" value="350">
    </div>
  </div>
  
  <div class="form-group">
    <label class="pp-label">Конфигурация (JSON)</label>
    <textarea id="chartData" class="pp-input">[{"label":"Данные","data":[30,50,20],"backgroundColor":["#3B82F6","#10B981","#F59E0B"]}]</textarea>
  </div>
  
  <div class="form-group">
    <label class="pp-label">Цвета (клик для копирования):</label>
    <div id="tokensList" class="tokens-container"></div>
  </div>
  
  <button id="insertBtn" class="pp-btn pp-btn-primary" style="width: 100%; height: 36px; border-radius: 4px;">Вставить в макет</button>
  
  <div class="btn-group">
    <button id="saveSvgBtn" class="pp-btn pp-btn-secondary" style="flex: 1; height: 32px; border-radius: 4px;">Скачать SVG</button>
    <button id="savePngBtn" class="pp-btn pp-btn-secondary" style="flex: 1; height: 32px; border-radius: 4px;">Скачать PNG</button>
  </div>

  <script>
    const API_URL = 'https://ezersky.ru';
    const DEFAULT_PALETTE = [{name:"Синий",color:"#3B82F6"},{name:"Зеленый",color:"#10B981"},{name:"Оранжевый",color:"#F59E0B"},{name:"Красный",color:"#EF4444"}];
    
    // Сразу при загрузке рендерим безопасную палитру (так как мы изолированы от API Penpot)
    window.onload = () => { 
      renderTokens([]); 
    };
    
    function renderTokens(tokens) {
      const container = document.getElementById('tokensList'); 
      container.innerHTML = '';
      const t = document.createElement('div'); t.className = 'fallback-title'; t.innerText = 'Встроенная палитра цветов:'; container.appendChild(t);
      DEFAULT_PALETTE.forEach(createBadge);
    }
    
    function createBadge(t) {
      const b = document.createElement('span'); b.className = 'token-badge'; b.style.borderLeft = `4px solid ${t.color}`; b.innerText = `${t.name} (${t.color})`;
      b.onclick = () => navigator.clipboard.writeText(t.color); 
      document.getElementById('tokensList').appendChild(b);
    }
    
    function buildConfig(fmt = 'svg') {
      try {
        const rawData = document.getElementById('chartData').value;
        const datasets = JSON.parse(rawData);
        const firstDataset = datasets[0] || { data: [] };
        const dataLength = firstDataset.data ? firstDataset.data.length : 3;
        
        return { 
          format: fmt, 
          width: parseInt(document.getElementById('width').value) || 500, 
          height: parseInt(document.getElementById('height').value) || 350,
          chart: { 
            type: document.getElementById('chartType').value, 
            data: { 
              labels: ["А","Б","В","Г","Д","Е"].slice(0, dataLength), 
              datasets: datasets 
            }, 
            options: { responsive: true } 
          } 
        };
      } catch(e) { 
        alert('Ошибка в формате JSON! Проверьте квадратные скобки и кавычки.'); 
        return null; 
      }
    }
    
    document.getElementById('insertBtn').onclick = async () => {
      const cfg = buildConfig('svg'); 
      if (!cfg) return;
      
      try {
        const res = await fetch(API_URL, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(cfg) 
        });
        if (!res.ok) throw new Error();
        const svgCode = await res.text();
        parent.postMessage({ type: 'insert-chart', svgCode: svgCode }, '*');
      } catch(e) {
        alert('Сервер qc.ezersky.ru не ответил. Убедитесь, что Docker запущен, а в Nginx настроены CORS заголовки.');
      }
    };
    
    document.getElementById('saveSvgBtn').onclick = async () => {
      const cfg = buildConfig('svg'); if (!cfg) return;
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
        download(await res.text(), 'chart.svg', 'image/svg+xml');
      } catch(e) { alert('Ошибка скачивания SVG'); }
    };
    
    document.getElementById('savePngBtn').onclick = async () => {
      const cfg = buildConfig('png'); if (!cfg) return;
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
        const blob = await res.blob();
        const u = window.URL.createObjectURL(blob); 
        const a = document.createElement('a'); a.href = u; a.download = 'chart.png'; a.click();
      } catch(e) { alert('Ошибка скачивания PNG'); }
    };
    
    function download(c, f, m) { 
      const a = document.createElement("a"); 
      a.href = URL.createObjectURL(new Blob([c], {type: m})); 
      a.download = f; 
      a.click(); 
    }
  </script>
</body>
</html>
